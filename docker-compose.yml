services:
  sharebox:
    build: .
    container_name: sharebox
    restart: unless-stopped
    ports:
      - "8890:8000"          # 左边是 NAS 上对外端口, 可自行修改
    volumes:
      - ./data:/data         # 分享数据保存在这里, 升级容器不丢失
    environment:
      # ACCESS_CODE: "123456" # 如需口令保护, 取消注释并设置口令
      MAX_UPLOAD_MB: "1024"  # 单文件大小上限 (MB)
