<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件下载 · ShareBox</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e4e6ea; --txt:#1c1e21; --sub:#6b7280; --main:#2563eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:24px 16px; }
  .card { width:100%; max-width:480px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  .icon { font-size:52px; }
  h1 { font-size:18px; margin:12px 0 6px; word-break:break-all; }
  .meta { color:var(--sub); font-size:14px; margin-bottom:20px; }
  .btn { display:inline-block; background:var(--main); color:#fff; border:none; border-radius:10px; padding:12px 32px; font-size:16px; cursor:pointer; text-decoration:none; }
  .err { color:#dc2626; font-size:15px; }
</style>
</head>
<body>
<div class="card" id="box">
  <div class="icon">⏳</div>
</div>
<script>
const sid = location.pathname.split('/').pop();
function fmtSize(n){
  if (n < 1024) return n + ' B';
  if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
  if (n < 1073741824) return (n/1048576).toFixed(1) + ' MB';
  return (n/1073741824).toFixed(2) + ' GB';
}
fetch('/api/info/' + sid).then(r=>r.json()).then(d=>{
  if (d.type !== 'file') { location.href = '/t/' + sid; return; }
  let left = '';
  if (d.left > 0) {
    const s = d.left;
    left = s < 3600 ? ' · ' + Math.ceil(s/60) + ' 分钟后过期'
         : s < 86400 ? ' · ' + Math.ceil(s/3600) + ' 小时后过期'
         : ' · ' + Math.ceil(s/86400) + ' 天后过期';
  }
  document.getElementById('box').innerHTML =
    '<div class="icon">📄</div>' +
    '<h1>' + escapeHtml(d.name) + '</h1>' +
    '<div class="meta">' + fmtSize(d.size) + left + '</div>' +
    '<a class="btn" href="/api/download/' + sid + '">⬇ 下载文件</a>';
}).catch(()=>{
  document.getElementById('box').innerHTML = '<div class="icon">😕</div><h1>文件不存在或已过期</h1>';
});
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
