<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareBox · 共享聊天</title>
<style>
  :root {
    --wx-bg:#ededed; --wx-green:#95ec69; --wx-white:#fff;
    --wx-line:#d9d9d9; --txt:#191919; --sub:#7f7f7f; --blue:#07c160;
  }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--wx-bg); color:var(--txt);
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  /* ===== 顶部标题栏 (微信风格) ===== */
  .navbar {
    flex-shrink:0; background:#f7f7f7; border-bottom:1px solid var(--wx-line);
    padding:10px 14px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .navbar h1 { font-size:17px; font-weight:600; }
  .navbar .live { font-size:11px; color:var(--blue); background:#e8f7ee; border-radius:99px; padding:2px 9px; }
  .navbar .live.off { color:#dc2626; background:#fee2e2; }
  .navbar .nickbox { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .navbar .nickbox input {
    width:110px; padding:6px 10px; border:1px solid var(--wx-line);
    border-radius:6px; font-size:13px; background:#fff;
  }

  /* ===== 聊天区 ===== */
  .chat {
    flex:1; overflow-y:auto; padding:16px 12px 12px;
    display:flex; flex-direction:column; gap:2px;
  }
  .time-divider {
    text-align:center; margin:14px 0 10px;
  }
  .time-divider span {
    font-size:12px; color:var(--sub); background:#dadada;
    border-radius:4px; padding:2px 8px;
  }
  .row { display:flex; margin-bottom:14px; }
  .row.self { flex-direction:row-reverse; }
  .avatar {
    width:38px; height:38px; border-radius:6px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; color:#fff; font-weight:600; user-select:none;
  }
  .row.other .avatar { background:#6b9bd8; margin-right:10px; }
  .row.self  .avatar { background:var(--blue); margin-left:10px; }
  .msg-wrap { max-width:72%; display:flex; flex-direction:column; }
  .row.self .msg-wrap { align-items:flex-end; }
  .nickname { font-size:12px; color:var(--sub); margin:0 4px 4px; }
  .row.self .nickname { display:none; }
  .bubble {
    position:relative; padding:9px 12px; border-radius:6px;
    font-size:15px; line-height:1.5; word-break:break-all; white-space:pre-wrap;
    background:var(--wx-white); box-shadow:0 1px 1px rgba(0,0,0,.03);
  }
  .row.self .bubble { background:var(--wx-green); }
  /* 小尾巴 */
  .bubble::before {
    content:""; position:absolute; top:12px; width:0; height:0;
    border:6px solid transparent;
  }
  .row.other .bubble::before { left:-11px; border-right-color:var(--wx-white); }
  .row.self  .bubble::before { right:-11px; border-left-color:var(--wx-green); }
  .meta { font-size:11px; color:var(--sub); margin:4px 4px 0; }
  .row.self .meta { text-align:right; }

  /* 文件气泡 */
  .file-bubble {
    display:flex; align-items:center; gap:10px; min-width:200px; max-width:260px;
  }
  .file-bubble .ficon { font-size:26px; }
  .file-bubble .finfo { flex:1; min-width:0; }
  .file-bubble .fname { font-size:14px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-bubble .fsize { font-size:12px; color:var(--sub); margin-top:2px; }
  .file-bubble .dl {
    flex-shrink:0; font-size:13px; color:var(--blue); text-decoration:none;
    border:1px solid var(--blue); border-radius:6px; padding:4px 10px;
  }
  .row.self .file-bubble .dl { color:#0b6d33; border-color:#0b6d33; }

  .ops { display:flex; gap:6px; margin:6px 4px 0; }
  .ops button {
    font-size:12px; color:var(--sub); background:#e4e4e4; border:none;
    border-radius:5px; padding:3px 10px; cursor:pointer;
  }
  .row.self .ops { flex-direction:row-reverse; }

  /* ===== 底部输入栏 (微信风格) ===== */
  .composer {
    flex-shrink:0; background:#f7f7f7; border-top:1px solid var(--wx-line);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:flex-end; gap:8px;
  }
  .composer .attach {
    width:34px; height:34px; border:none; border-radius:8px; background:#e4e4e4;
    font-size:18px; cursor:pointer; flex-shrink:0;
  }
  .composer textarea {
    flex:1; border:1px solid var(--wx-line); border-radius:8px; background:#fff;
    padding:8px 10px; font-size:15px; font-family:inherit; resize:none;
    height:38px; max-height:120px; line-height:1.4;
  }
  .composer textarea:focus { outline:none; }
  .composer .send {
    border:none; border-radius:8px; background:var(--blue); color:#fff;
    font-size:14px; padding:0 18px; height:38px; cursor:pointer; flex-shrink:0;
  }
  .composer .send:disabled { background:#b8e6cd; }
  .composer select {
    height:38px; border:1px solid var(--wx-line); border-radius:8px;
    background:#fff; font-size:13px; padding:0 6px; flex-shrink:0;
  }
  .composer input[type=password] {
    height:38px; border:1px solid var(--wx-line); border-radius:8px;
    background:#fff; font-size:13px; padding:0 10px; width:110px; flex-shrink:0;
  }
  .hint { font-size:11px; color:var(--sub); text-align:center; padding:0 12px 6px; background:#f7f7f7; }

  .toast {
    position:fixed; left:50%; top:14%; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fff; font-size:14px;
    padding:8px 18px; border-radius:8px; opacity:0; transition:.25s; pointer-events:none; z-index:9;
  }
  .toast.show { opacity:1; }
  .pending { text-align:center; color:var(--sub); font-size:13px; padding:12px 0; }
</style>
</head>
<body>

<div class="navbar">
  <h1>📦 ShareBox</h1>
  <span class="live" id="live">● 同步中</span>
  <div class="nickbox">
    <input id="nick" placeholder="我的昵称" maxlength="30">
  </div>
</div>

<div class="chat" id="chat"></div>

<div class="composer">
  <button class="attach" id="attachBtn" title="发送文件">📎</button>
  <input type="file" id="file" style="display:none">
  <textarea id="content" rows="1" placeholder="说点什么, 或粘贴文本…"></textarea>
  <select id="expiry" title="有效期">
    <option value="3600">1小时</option>
    <option value="86400">1天</option>
    <option value="604800" selected>7天</option>
    <option value="2592000">30天</option>
    <option value="0">永久</option>
  </select>
  <input type="password" id="code" placeholder="口令" title="访问口令(可选)">
  <button class="send" id="sendBtn" onclick="sendText()">发送</button>
</div>
<div class="hint">所有设备打开同一网址即可实时看到彼此发送的文本和文件</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let pickedFile = null;
let lastKey = '';

/* ---------- 工具 ---------- */
$('nick').value = localStorage.getItem('sb_nick') || '';
$('nick').addEventListener('input', () => {
  localStorage.setItem('sb_nick', $('nick').value.trim());
  render(true);   // 昵称变化后左右归属立即刷新
});
const myNick = () => $('nick').value.trim();
const esc = s => (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmtSize(n){ return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB'; }
function fmtTime(t){ const d=new Date(t*1000); return (d.getMonth()+1)+'月'+(d.getDate())+'日 '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtLeft(s){ if(!s) return ''; if(s<3600) return ' · '+Math.ceil(s/60)+'分钟后过期'; if(s<86400) return ' · '+Math.ceil(s/3600)+'小时后过期'; return ' · '+Math.ceil(s/86400)+'天后过期'; }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1600); }
const isSelf = m => myNick() && m.frm === myNick();

/* ---------- 渲染 (微信气泡) ---------- */
function render(){
  const chat = $('chat');
  const st = chat.scrollTop, sh = chat.scrollHeight, ch = chat.clientHeight;
  const atBottom = sh - st - ch < 80;   // 用户停在上方时不强制滚动

  const items = [];
  fetch('/api/board').then(r=>r.json()).then(d=>{
    lastKey = JSON.stringify(d);
    const list = [];
    d.texts.forEach(t => list.push({...t, ts:t.created}));
    d.files.forEach(f => list.push({...f, ts:f.created}));
    list.sort((a,b)=>a.ts-b.ts);

    if (!list.length) {
      chat.innerHTML = '<div class="pending">还没有消息, 发一条试试吧</div>';
      return;
    }
    let lastTs = 0;
    let html = '';
    list.forEach(m=>{
      if (m.ts - lastTs > 300) {   // 隔 5 分钟以上插一个时间条
        html += `<div class="time-divider"><span>${fmtTime(m.ts)}</span></div>`;
        lastTs = m.ts;
      }
      const self = isSelf(m);
      const initial = esc((m.frm || '匿')[0]);
      let bubble;
      if (m.type === 'text') {
        bubble = `<div class="bubble">${esc(m.full)}</div>`;
      } else {
        bubble = `<div class="bubble file-bubble">
            <span class="ficon">📄</span>
            <div class="finfo">
              <div class="fname">${esc(m.name)}</div>
              <div class="fsize">${fmtSize(m.size)}</div>
            </div>
            <a class="dl" href="/api/download/${m.id}" download>下载</a>
          </div>`;
      }
      html += `<div class="row ${self?'self':'other'}">
          <div class="avatar">${initial}</div>
          <div class="msg-wrap">
            <div class="nickname">${esc(m.frm || '匿名')}</div>
            ${bubble}
            <div class="meta">${fmtTime(m.ts)}${fmtLeft(m.left)}</div>
            <div class="ops">
              ${m.type==='text' ? `<button onclick="copyMsg('${m.id}', this)">复制</button>` : ''}
              <button onclick="delMsg('${m.id}')">删除</button>
            </div>
          </div>
        </div>`;
    });
    chat.innerHTML = html;
    if (atBottom) chat.scrollTop = chat.scrollHeight;
  }).catch(()=>{
    $('live').textContent = '● 连接断开';
    $('live').classList.add('off');
  });
  $('live').textContent = '● 同步中';
  $('live').classList.remove('off');
}

/* ---------- 实时轮询 ---------- */
async function poll(){
  try {
    const r = await fetch('/api/board');
    if (!r.ok) throw 0;
    const d = await r.json();
    const key = JSON.stringify(d);
    if (key !== lastKey) render();
    $('live').textContent = '● 同步中';
    $('live').classList.remove('off');
  } catch(e) {
    $('live').textContent = '● 连接断开, 重试中';
    $('live').classList.add('off');
  }
}
setInterval(poll, 2000);
render();

/* ---------- 发送 ---------- */
async function postForm(url, fd){
  try {
    const r = await fetch(url, {method:'POST', body:fd});
    const d = await r.json();
    if (!r.ok) { toast(d.detail || '操作失败'); return null; }
    return d;
  } catch(e){ toast('网络错误'); return null; }
}
async function sendText(){
  const c = $('content').value;
  if (!c.trim()) return;
  const fd = new FormData();
  fd.append('content', c);
  fd.append('expiry', $('expiry').value);
  fd.append('code', $('code').value);
  fd.append('frm', myNick());
  const d = await postForm('/api/text', fd);
  if (d) {
    $('content').value = ''; autoGrow($('content'));
    lastKey = JSON.stringify(d); render();
    toast('已发送');
  }
}
$('attachBtn').onclick = () => $('file').click();
$('file').addEventListener('change', e=>{
  pickedFile = e.target.files[0] || null;
  if (pickedFile) uploadFile();
});
async function uploadFile(){
  if (!pickedFile) return;
  const fd = new FormData();
  fd.append('file', pickedFile);
  fd.append('expiry', $('expiry').value);
  fd.append('code', $('code').value);
  fd.append('frm', myNick());
  const d = await postForm('/api/file', fd);
  $('file').value = ''; pickedFile = null;
  if (d) { lastKey = JSON.stringify(d); render(); toast('文件已发送'); }
}
/* Enter 发送, Shift+Enter 换行 */
const ta = $('content');
ta.addEventListener('keydown', e=>{
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); }
});
ta.addEventListener('input', ()=>autoGrow(ta));
function autoGrow(el){ el.style.height='38px'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

/* ---------- 复制 / 删除 ---------- */
async function copyMsg(id, btn){
  const r = await fetch('/api/raw/' + id);
  if (!r.ok) { toast('内容已不存在'); return; }
  const text = await r.text();
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(()=>{ btn.textContent='已复制'; setTimeout(()=>btn.textContent='复制',1500); })
    .catch(()=>toast('复制失败, 请长按选择文本'));
}
async function delMsg(id){
  if (!confirm('确定删除这条消息?')) return;
  const fd = new FormData();
  fd.append('id', id);
  fd.append('code', $('code').value);
  await postForm('/api/delete', fd);
  poll();
}
</script>
</body>
</html>
