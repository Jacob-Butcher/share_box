<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShareBox · 共享空间</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e4e6ea; --txt:#1c1e21; --sub:#6b7280; --main:#2563eb; --red:#dc2626; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; padding:24px 16px 60px; }
  .wrap { max-width:760px; margin:0 auto; }
  header { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:18px; }
  h1 { font-size:24px; }
  .live { font-size:12px; color:#16a34a; background:#e8f7ee; border-radius:99px; padding:3px 10px; }
  .nickbox { margin-left:auto; display:flex; gap:6px; align-items:center; }
  .nickbox input { width:110px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  h2 { font-size:16px; margin-bottom:12px; }
  textarea { width:100%; height:120px; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px; resize:vertical; font-family:inherit; }
  textarea:focus { outline:none; border-color:var(--main); }
  .bar { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  select, input[type=password] { padding:9px 10px; border:1px solid var(--line); border-radius:8px; font-size:14px; background:#fff; }
  input[type=password] { width:130px; }
  .btn { background:var(--main); color:#fff; border:none; border-radius:10px; padding:10px 20px; font-size:14px; cursor:pointer; }
  .btn:active { opacity:.85; }
  .btn.gray { background:#eef0f3; color:var(--txt); }
  .btn.small { padding:6px 12px; font-size:13px; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:26px 14px; text-align:center; color:var(--sub); cursor:pointer; transition:.15s; }
  .drop.hover { border-color:var(--main); background:#f0f5ff; color:var(--main); }
  .fname { margin-top:8px; font-size:14px; word-break:break-all; }
  .msg { color:var(--red); font-size:14px; margin-top:10px; min-height:20px; }
  .list { display:flex; flex-direction:column; gap:10px; }
  .item { border:1px solid var(--line); border-radius:10px; padding:12px 14px; display:flex; gap:12px; align-items:flex-start; animation:pop .25s; }
  @keyframes pop { from { opacity:0; transform:translateY(-4px);} to { opacity:1; transform:none;} }
  .item .body { flex:1; min-width:0; }
  .item .txt { font-size:14px; white-space:pre-wrap; word-break:break-all; max-height:120px; overflow:auto; font-family:ui-monospace,Menlo,Consolas,monospace; background:#fafafa; border-radius:8px; padding:8px 10px; }
  .item .fn { font-size:15px; word-break:break-all; }
  .item .meta { color:var(--sub); font-size:12px; margin-top:6px; }
  .item .ops { display:flex; flex-direction:column; gap:6px; flex-shrink:0; }
  .empty { color:var(--sub); font-size:14px; text-align:center; padding:18px 0; }
  .toast { position:fixed; left:50%; top:18px; transform:translateX(-50%); background:#111827; color:#fff; font-size:13px; padding:8px 16px; border-radius:99px; opacity:0; transition:.3s; pointer-events:none; z-index:9; }
  .toast.show { opacity:.92; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📦 ShareBox</h1>
    <span class="live" id="live">● 实时同步中</span>
    <div class="nickbox">
      <span style="font-size:13px;color:var(--sub)">我的昵称</span>
      <input id="nick" placeholder="如: 手机/电脑" maxlength="30">
    </div>
  </header>

  <div class="card">
    <h2>📝 分享文本</h2>
    <textarea id="content" placeholder="粘贴文本, 点「分享」后所有设备都能看到并复制"></textarea>
    <div class="bar">
      <select id="expiry">
        <option value="3600">1 小时</option>
        <option value="86400">1 天</option>
        <option value="604800" selected>7 天</option>
        <option value="2592000">30 天</option>
        <option value="0">永久</option>
      </select>
      <input type="password" id="code" placeholder="访问口令(可选)">
      <button class="btn" style="margin-left:auto" onclick="shareText()">分享</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>📁 分享文件</h2>
    <div class="drop" id="drop" onclick="document.getElementById('file').click()">
      点击选择文件, 或拖拽到此处
      <div class="fname" id="fname"></div>
    </div>
    <input type="file" id="file" style="display:none" onchange="showName(this.files)">
    <div class="bar">
      <button class="btn" style="margin-left:auto" onclick="shareFile()">上传并分享</button>
    </div>
    <div class="msg" id="msg2"></div>
  </div>

  <div class="card">
    <h2>🕐 最新文本</h2>
    <div class="list" id="texts"></div>
  </div>

  <div class="card">
    <h2>📂 共享文件</h2>
    <div class="list" id="files"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = id => document.getElementById(id);
let pickedFile = null;
let lastBoard = '';

// 昵称持久化
$('nick').value = localStorage.getItem('sb_nick') || '';
$('nick').addEventListener('input', () => localStorage.setItem('sb_nick', $('nick').value.trim()));

function nick(){ return $('nick').value.trim(); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(n){ return n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':n<1073741824?(n/1048576).toFixed(1)+' MB':(n/1073741824).toFixed(2)+' GB'; }
function fmtTime(t){ const d=new Date(t*1000); return (d.getMonth()+1)+'/'+d.getDate()+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtLeft(s){ if(!s) return '永久'; if(s<3600) return Math.ceil(s/60)+'分钟后过期'; if(s<86400) return Math.ceil(s/3600)+'小时后过期'; return Math.ceil(s/86400)+'天后过期'; }
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1600); }

function render(data){
  const ts = $('texts'), fs = $('files');
  if (!data.texts.length) ts.innerHTML = '<div class="empty">还没有分享的文本</div>';
  else ts.innerHTML = data.texts.map(t => `
    <div class="item">
      <div class="body">
        <div class="txt">${esc(t.full)}</div>
        <div class="meta">${esc(t.frm || '匿名')} · ${fmtTime(t.created)} · ${fmtSize(t.size)} · ${fmtLeft(t.left)}</div>
      </div>
      <div class="ops">
        <button class="btn small" onclick="copyText('${t.id}', this)">复制</button>
        <button class="btn small gray" onclick="del('${t.id}')">删除</button>
      </div>
    </div>`).join('');
  if (!data.files.length) fs.innerHTML = '<div class="empty">还没有上传的文件</div>';
  else fs.innerHTML = data.files.map(f => `
    <div class="item">
      <div class="body">
        <div class="fn">📄 ${esc(f.name)}</div>
        <div class="meta">${esc(f.frm || '匿名')} · ${fmtTime(f.created)} · ${fmtSize(f.size)} · ${fmtLeft(f.left)}</div>
      </div>
      <div class="ops">
        <a class="btn small" style="text-decoration:none" href="/api/download/${f.id}" download>下载</a>
        <button class="btn small gray" onclick="del('${f.id}')">删除</button>
      </div>
    </div>`).join('');
}

// 实时轮询: 所有设备看到一致的内容
async function poll(){
  try {
    const r = await fetch('/api/board');
    if (!r.ok) throw 0;
    const data = await r.json();
    const key = JSON.stringify(data);
    if (key !== lastBoard) {
      lastBoard = key;
      render(data);
    }
    $('live').style.color = '#16a34a';
    $('live').textContent = '● 实时同步中';
  } catch(e) {
    $('live').style.color = '#dc2626';
    $('live').textContent = '● 连接断开, 重试中';
  }
}
setInterval(poll, 2000);
poll();

async function postForm(url, fd, msgEl){
  msgEl.textContent = '';
  try {
    const r = await fetch(url, {method:'POST', body:fd});
    const data = await r.json();
    if (!r.ok) { msgEl.textContent = data.detail || '操作失败'; return null; }
    return data;
  } catch(e) { msgEl.textContent = '网络错误: ' + e.message; return null; }
}

async function shareText(){
  const c = $('content').value;
  if (!c.trim()) { $('msg').textContent = '请先输入文本内容'; return; }
  const fd = new FormData();
  fd.append('content', c);
  fd.append('expiry', $('expiry').value);
  fd.append('code', $('code').value);
  fd.append('frm', nick());
  const d = await postForm('/api/text', fd, $('msg'));
  if (d) { $('content').value = ''; lastBoard = JSON.stringify(d); render(d); toast('已分享, 所有设备可见'); }
}

function showName(files){
  pickedFile = files[0] || null;
  $('fname').textContent = pickedFile ? pickedFile.name : '';
}
const drop = $('drop');
drop.addEventListener('dragover', e=>{e.preventDefault(); drop.classList.add('hover');});
drop.addEventListener('dragleave', ()=>drop.classList.remove('hover'));
drop.addEventListener('drop', e=>{
  e.preventDefault(); drop.classList.remove('hover');
  $('file').files = e.dataTransfer.files;
  showName(e.dataTransfer.files);
});

async function shareFile(){
  if (!pickedFile) { $('msg2').textContent = '请先选择文件'; return; }
  const fd = new FormData();
  fd.append('file', pickedFile);
  fd.append('expiry', $('expiry').value);
  fd.append('code', $('code').value);
  fd.append('frm', nick());
  const d = await postForm('/api/file', fd, $('msg2'));
  if (d) {
    $('file').value = ''; $('fname').textContent = ''; pickedFile = null;
    lastBoard = JSON.stringify(d); render(d); toast('已上传, 所有设备可见');
  }
}

async function del(id){
  if (!confirm('确定删除这条分享?')) return;
  const fd = new FormData();
  fd.append('id', id);
  fd.append('code', $('code').value);
  await postForm('/api/delete', fd, $('msg'));
  poll();
}

async function copyText(id, btn){
  const r = await fetch('/api/raw/' + id);
  if (!r.ok) { toast('内容已不存在'); return; }
  const text = await r.text();
  (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
    .then(()=>{ btn.textContent = '✅ 已复制'; setTimeout(()=>btn.textContent='复制', 1500); })
    .catch(()=>{ toast('复制失败, 请手动选择文本'); });
}
</script>
</body>
</html>
