<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本分享 · ShareBox</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --line:#e4e6ea; --txt:#1c1e21; --sub:#6b7280; --main:#2563eb; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--txt); min-height:100vh; display:flex; justify-content:center; padding:32px 16px; }
  .wrap { width:100%; max-width:720px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  h1 { font-size:20px; margin-bottom:14px; }
  textarea { width:100%; height:320px; border:1px solid var(--line); border-radius:10px; padding:12px; font-size:14px; font-family:ui-monospace,Menlo,Consolas,monospace; resize:vertical; background:#fafafa; }
  textarea:focus { outline:none; }
  .row { display:flex; gap:10px; margin-top:14px; align-items:center; flex-wrap:wrap; }
  .btn { background:var(--main); color:#fff; border:none; border-radius:10px; padding:10px 20px; font-size:15px; cursor:pointer; }
  .btn.gray { background:#eef0f3; color:var(--txt); }
  .meta { color:var(--sub); font-size:13px; }
  .err { color:#dc2626; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>📝 分享的文本</h1>
    <textarea id="content" readonly></textarea>
    <div class="row">
      <button class="btn" onclick="copyText()">📋 复制全文</button>
      <a class="btn gray" style="text-decoration:none" id="rawLink" href="#">查看原始文本</a>
      <span class="meta" id="meta"></span>
      <span class="meta err" id="err"></span>
    </div>
  </div>
</div>
<script>
const sid = location.pathname.split('/').pop();
document.getElementById('rawLink').href = '/api/raw/' + sid;
fetch('/api/info/' + sid).then(r=>r.json()).then(d=>{
  if (d.type !== 'text') { location.href = '/f/' + sid; return; }
  if (d.left > 0) document.getElementById('meta').textContent = '剩余 ' + fmt(d.left);
}).catch(()=>{});
fetch('/api/text/' + sid).then(r=>{
  if (!r.ok) throw 0;
  return r.json();
}).then(d=>{ document.getElementById('content').value = d.content; })
.catch(()=>{ document.getElementById('err').textContent = '内容不存在或已过期'; });
function fmt(s){
  if (s < 3600) return Math.ceil(s/60) + ' 分钟';
  if (s < 86400) return Math.ceil(s/3600) + ' 小时';
  return Math.ceil(s/86400) + ' 天';
}
function copyText(){
  const t = document.getElementById('content');
  const btn = event.target;
  (navigator.clipboard ? navigator.clipboard.writeText(t.value) : Promise.reject())
    .then(()=>{ btn.textContent = '✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制全文', 1500); })
    .catch(()=>{ t.select(); document.execCommand('copy'); btn.textContent = '✅ 已复制'; setTimeout(()=>btn.textContent='📋 复制全文', 1500); });
}
</script>
</body>
</html>
